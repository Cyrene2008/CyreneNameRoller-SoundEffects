name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入版本号（如 v1.2.3）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build

      # 动态设置环境变量，供后续步骤使用
      - name: Set version from input
        run: echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      # 验证输入的版本号是否与 manifest.yml 一致
      - name: Verify tag version
        run: |
          EXPECTED_VERSION="v$(node -e "import('./scripts/plugin-cli.mjs').then(async m => process.stdout.write(String((await m.readIdentity()).identity.version)))")"
          if [ "$RELEASE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ 版本不匹配！输入的是 $RELEASE_VERSION，但 manifest.yml 中是 $EXPECTED_VERSION"
            exit 1
          fi

      # 创建 Release（如果已存在则跳过或更新）
      - name: Create or update release
        run: |
          # 先尝试删除旧的 Release（如果存在）
          gh release delete "$RELEASE_VERSION" --yes || true
          # 再创建新的 Release
          gh release create "$RELEASE_VERSION" dist/*.cnrp --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
